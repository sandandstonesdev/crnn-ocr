# Wszystkie hiperparametry i ścieżki w jednym miejscu.
# Uruchomienie: python main.py --config configs/default.yaml

data:
  train_dir: data/raw/train
  val_dir: data/raw/val
  charset_file: configs/charset.json   # przebudowa: python data/charset.py
  batch_size: 32
  num_workers: 0                       # 0 = najbezpieczniej na Windowsie

model:
  lstm_hidden: 256
  lstm_layers: 2

train:                                 # sekcja dla przyszłego train.py
  device: auto                         # auto | cpu | cuda
  epochs: 20
  lr: 0.001
  checkpoint_dir: checkpoints
  log_dir: runs                        # tensorboard --logdir runs
